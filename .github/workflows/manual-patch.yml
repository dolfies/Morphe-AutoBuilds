name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (from apps/ folder)"
        required: true
        type: string
        default: "youtube"

      source:
        description: "Source name (from sources/ folder)"
        required: true
        type: string
        default: "revanced"

      version:
        description: "Specific version (leave empty for latest)"
        required: false
        type: string
        default: ""

      architecture:
        description: "Architecture to build"
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: "universal"

      replace_in_release:
        description: "Replace APK in existing release"
        required: true
        type: boolean
        default: true

jobs:
  manual-patch:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Specific Version
        if: ${{ inputs.version != '' }}
        run: |
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"

            if [ -f "$config_file" ]; then
              echo "Updating $config_file with version ${{ inputs.version }}"

              python - "$config_file" "${{ inputs.version }}" <<'PY'
          import json
          import sys

          config_file = sys.argv[1]
          version = sys.argv[2]

          with open(config_file, "r") as f:
              config = json.load(f)

          config["version"] = version

          with open(config_file, "w") as f:
              json.dump(config, f, indent=2)
          PY

              echo "Updated: $config_file"
              break
            fi
          done

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8192/ > /dev/null 2>&1; then
              echo "FlareSolverr is ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          echo "🔧 Building ${{ inputs.app_name }} with ${{ inputs.source }} for ${{ inputs.architecture }} architecture..."
          python -m src

      - name: Normalize Asset Names
        run: |
          # GitHub rewrites names with spaces/parentheses on upload, which
          # would desync the cleanup keep-list below.
          python scripts/safe_asset_names.py --apks-dir .

      - name: Find Built APK
        id: find-apk
        run: |
          apk_files=$(ls -1 *.apk 2>/dev/null || true)

          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi

          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"

          echo "Found these APKs:"
          echo "$apk_files"

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"

      - name: Check Existing Release
        if: ${{ inputs.replace_in_release == true }}
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "✅ Release 'latest' exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Release 'latest' does not exist"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Release
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Updating release efficiently..."

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            gh release view latest --json assets --jq '.assets[].name' > current_assets.txt
          else
            touch current_assets.txt
          fi

          for apk in *.apk; do
            echo "$apk" >> current_assets.txt
          done

          cat > release_notes.md <<EOF
          # Morphe APKs

          ## 📱 Available Apps
          EOF

          sort -u current_assets.txt | while read -r filename; do
            echo "- $filename" >> release_notes.md
          done

          cat >> release_notes.md <<EOF

          ---

          **Last Update:** $(date)
          **Updated App:** ${{ inputs.app_name }}
          **Architecture:** ${{ inputs.architecture }}
          **Source:** ${{ inputs.source }}

          Auto-updates daily at 6 AM UTC.
          EOF

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            echo "⬆️ Uploading new assets..."
            gh release upload latest *.apk --clobber

            # Upload first, then delete superseded older-version APKs for this
            # app/arch, so a failed upload never loses the old APK. No `||`
            # fallback: a failed cleanup should fail the job loudly.
            : > keep_apks.txt
            for apk in *.apk; do
              [ -f "$apk" ] || continue
              echo "$apk" >> keep_apks.txt
            done
            python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt

            echo "📝 Updating release title and notes..."
            gh release edit latest \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md
          else
            echo "🚀 Creating new release..."
            gh release create latest \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md \
              *.apk \
              --latest
          fi

          echo "✅ Release updated successfully!"

      - name: Show Download Links
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)

          echo "🔗 Updated Release URL: $release_url"
          echo ""
          echo "📦 Direct APK links:"

          for apk in *.apk; do
            echo "  - $release_url/download/$apk"
          done

      - name: Cleanup Version Override
        if: ${{ always() && inputs.version != '' }}
        run: |
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"

            if [ -f "$config_file" ]; then
              echo "Resetting version in $config_file"

              python - "$config_file" <<'PY'
          import json
          import sys

          config_file = sys.argv[1]

          with open(config_file, "r") as f:
              config = json.load(f)

          config["version"] = ""

          with open(config_file, "w") as f:
              json.dump(config, f, indent=2)
          PY

            fi
          done
